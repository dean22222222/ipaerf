<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sound Board</title>
<style>
:root{color-scheme:dark;--bg:#12101f;--fg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;background:var(--bg);padding:14px 14px 8px;z-index:2}
h1{margin:0 0 10px;font-size:26px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab,.stop{border:0;border-radius:20px;padding:8px 16px;font-size:15px;font-weight:700;background:#2a2646;color:#fff}
.tab.on{background:#ffd54a;color:#1a1a1a}.stop{background:#ff5a5a;margin-left:auto}
.vol{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px}.vol input{flex:1}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:8px 14px 30px}
.pad{height:96px;border:0;border-radius:18px;color:#fff;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .08s}
.pad:active{transform:scale(.93)}.pad span{font-size:34px}
</style></head><body>

g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.015);g.gain.setValueAtTime(v,s+Math.max(.02,d-.06));g.gain.exponentialRampToValueAtTime(.0001,s+d);
let n=os;if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vf||6;lg.gain.value=f*(o.vib/100);l.connect(lg);lg.connect(os.frequency);l.start(s);l.stop(s+d+.05)}
if(o.flt){const b=c.createBiquadFilter();b.type=o.flt[0];b.frequency.value=o.flt[1];b.Q.value=o.flt[2]||1;os.connect(b);n=b}
n.connect(g);g.connect(master);os.start(s);os.stop(s+d+.05);live.push(os)}
function noise(o){const c=A(),s=c.currentTime+(o.t||0),d=o.d||.3,len=Math.ceil(c.sampleRate*d),buf=c.createBuffer(1,len,c.sampleRate),a=buf.getChannelData(0);
for(let i=0;i<len;i++)a[i]=Math.random()*2-1;const src=c.createBufferSource(),g=c.createGain();src.buffer=buf;
g.gain.setValueAtTime(o.v||.3,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);let n=src;
if(o.flt){const b=c.createBiquadFilter();b.type=o.flt[0];b.frequency.value=o.flt[1];b.Q.value=o.flt[2]||1;src.connect(b);n=b}
n.connect(g);g.connect(master);src.start(s);live.push(src)}
